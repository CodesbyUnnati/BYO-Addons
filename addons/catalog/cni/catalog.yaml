apiVersion: v1
kind: ConfigMap
metadata:
  name: byo-addons-cni-catalog
  namespace: byo-addons-system
  labels:
    platform.byoaddons.io/catalog: cni
data:
  providers.yaml: |
    providers:
    - name: cilium
      license: Apache-2.0
      mode: helm
      repoURL: https://helm.cilium.io
      chart: cilium
      notes: eBPF CNI with optional Hubble observability.
    - name: calico-oss
      license: Apache-2.0
      mode: helm
      repoURL: https://projectcalico.docs.tigera.io/charts
      chart: tigera-operator
      notes: Open source Calico networking and network policy.
    - name: flannel
      license: Apache-2.0
      mode: manifest
      repoURL: https://github.com/flannel-io/flannel
      path: Documentation/kube-flannel.yml
      notes: Simple overlay networking for small clusters.
