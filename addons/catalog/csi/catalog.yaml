apiVersion: v1
kind: ConfigMap
metadata:
  name: byo-addons-csi-catalog
  namespace: byo-addons-system
  labels:
    platform.byoaddons.io/catalog: csi
data:
  providers.yaml: |
    providers:
    - name: openebs
      license: Apache-2.0
      mode: helm
      repoURL: https://openebs.github.io/openebs
      chart: openebs
      notes: Local persistent volumes and storage engines.
    - name: rook-ceph
      license: Apache-2.0
      mode: helm
      repoURL: https://charts.rook.io/release
      chart: rook-ceph
      notes: Ceph storage operator with CSI drivers.
    - name: longhorn
      license: Apache-2.0
      mode: helm
      repoURL: https://charts.longhorn.io
      chart: longhorn
      notes: Distributed block storage for Kubernetes.
    - name: democratic-csi
      license: MIT
      mode: helm
      repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      notes: CSI drivers for several free and homelab storage backends.
