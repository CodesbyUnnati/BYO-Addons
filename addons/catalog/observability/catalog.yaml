apiVersion: v1
kind: ConfigMap
metadata:
  name: byo-addons-observability-catalog
  namespace: byo-addons-system
  labels:
    platform.byoaddons.io/catalog: observability
data:
  providers.yaml: |
    providers:
    - name: kube-prometheus-stack
      license: Apache-2.0
      mode: helm
      repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      notes: Prometheus Operator, Alertmanager, Grafana, and Kubernetes dashboards.
    - name: loki
      license: AGPL-3.0
      mode: helm
      repoURL: https://grafana.github.io/helm-charts
      chart: loki
      notes: Log aggregation, optional for a full observability stack.
