replicaCount: 1

image:
  repository: byo-addons-operator
  tag: "0.1.0"
  pullPolicy: IfNotPresent

namespaceOverride: ""

serviceAccount:
  create: true
  name: ""

leaderElection:
  enabled: true

metrics:
  enabled: true
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

sampleAddonSet:
  enabled: false
  clusterName: dev-kind
