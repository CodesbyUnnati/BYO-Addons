apiVersion: v1
kind: Namespace
metadata:
  name: byo-addons-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: byo-addons-controller-manager
  namespace: byo-addons-system
  labels:
    app.kubernetes.io/name: byo-addons
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: byo-addons
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: byo-addons
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: byo-addons-controller-manager
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: controller:latest
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: byo-addons-controller-manager-metrics
  namespace: byo-addons-system
  labels:
    app.kubernetes.io/name: byo-addons
    app.kubernetes.io/component: controller
spec:
  selector:
    app.kubernetes.io/name: byo-addons
    app.kubernetes.io/component: controller
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
