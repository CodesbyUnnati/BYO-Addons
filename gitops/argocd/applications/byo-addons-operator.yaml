apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: byo-addons-operator
  namespace: argocd
spec:
  project: byo-addons
  source:
    repoURL: https://github.com/example/byo-addons.git
    targetRevision: main
    path: charts/byo-addons-operator
    helm:
      releaseName: byo-addons
      values: |
        sampleAddonSet:
          enabled: true
          clusterName: dev-kind
  destination:
    server: https://kubernetes.default.svc
    namespace: byo-addons-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
