apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oss-cni-cilium
  namespace: argocd
spec:
  project: byo-addons
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.15.x
    helm:
      values: |
        kubeProxyReplacement: true
        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
