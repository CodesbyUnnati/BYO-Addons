apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oss-csi-openebs
  namespace: argocd
spec:
  project: byo-addons
  source:
    repoURL: https://openebs.github.io/openebs
    chart: openebs
    targetRevision: 4.x
  destination:
    server: https://kubernetes.default.svc
    namespace: openebs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
