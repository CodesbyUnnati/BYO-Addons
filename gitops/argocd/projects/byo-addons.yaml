apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: byo-addons
  namespace: argocd
spec:
  description: GitOps project for Bring Your Own Addons platform components.
  sourceRepos:
  - https://github.com/example/byo-addons.git
  - https://helm.cilium.io
  - https://projectcalico.docs.tigera.io/charts
  - https://openebs.github.io/openebs
  - https://charts.longhorn.io
  - https://charts.rook.io/release
  - https://prometheus-community.github.io/helm-charts
  destinations:
  - namespace: '*'
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
