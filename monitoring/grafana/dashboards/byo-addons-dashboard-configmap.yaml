apiVersion: v1
kind: ConfigMap
metadata:
  name: byo-addons-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  byo-addons.json: |
    {
      "title": "BYO Addons Operator",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "type": "stat",
          "title": "Reconcile Errors",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(controller_runtime_reconcile_errors_total{controller=\"addonset\"}[5m]))",
              "legendFormat": "errors"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Reconcile Duration p95",
          "gridPos": { "h": 8, "w": 16, "x": 8, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(controller_runtime_reconcile_time_seconds_bucket{controller=\"addonset\"}[5m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Workqueue Depth",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "workqueue_depth{name=\"addonset\"}",
              "legendFormat": "depth"
            }
          ]
        }
      ]
    }
