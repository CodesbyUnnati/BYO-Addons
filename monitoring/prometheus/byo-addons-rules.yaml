apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: byo-addons-operator
  namespace: monitoring
  labels:
    app.kubernetes.io/name: byo-addons
spec:
  groups:
  - name: byo-addons.rules
    rules:
    - alert: BYOAddonsOperatorDown
      expr: absent(up{job=~".*byo-addons.*"} == 1)
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: BYO Addons operator metrics are not being scraped
        description: Prometheus has not observed the BYO Addons operator target for 10 minutes.
    - alert: BYOAddonsReconcileErrors
      expr: rate(controller_runtime_reconcile_errors_total{controller="addonset"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: AddonSet reconciliation is failing
        description: The AddonSet controller is reporting reconciliation errors.
