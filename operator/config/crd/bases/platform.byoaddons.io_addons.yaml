apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: addons.platform.byoaddons.io
spec:
  group: platform.byoaddons.io
  names:
    kind: Addon
    plural: addons
    singular: addon
    shortNames:
      - addon
    listKind: AddonList
  scope: Namespaced
  versions:
